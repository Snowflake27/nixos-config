# Starship prompt setup
"$schema" = 'https://starship.rs/config-schema.json'

# Config
add_newline = true

format = """
$cmd_duration
[╭──[$username](bg:snow_dark)[$hostname](bg:snow_dark fg:snow_bright)─$directory─$fill$time──╮](fg:snow_dark)
([│](fg:snow_dark)  $vcs[│](fg:snow_dark)\n)\
([│](fg:snow_dark)  ${env_var.FLAKE_CONFIG}  $python  $nodejs  $php$blank_fill[│](fg:snow_dark)\n)\
[╰─](fg:snow_dark) $sudo$character
"""

right_format = """
[─](fg:snow_dark)$battery[](fg:snow_dark)$shell$os[──╯](fg:snow_dark)
"""

continuation_prompt = '▶▶ '

palette = "everforest"

[palettes.everforest]
# H: 19
orange_bright = "#fa986a"

# H: 40
yellow_dark   = "#5f4b25"
yellow_bright = "#faca6a"

# H: 134
green_dark   = "#374C3C"
green_bright = "#83C091"

# H: 179
snow_dark   = "#374c4c"
snow_bright = "#83c0bf"

# H: 223
blue_dark   = "#2f3b5a"
blue_bright = "#6f8cd3"

# H: 271
violet_dark   = "#43255f"
violet_bright = "#ae7fdb"

# H: 325
pink_dark   = "#5e3f51"
pink_bright = "#f58bc9"

# H: 359
red_dark   = "#4c3737"
red_bright = "#fa6a6d"

[cmd_duration]
show_notifications = true

format = """
    [┌───────────────────────────────┐](fg:violet_bright)
    [  󱦟 Duration: $duration          ](fg:violet_bright)
    [└───────────────────────────────┘](fg:violet_bright)
"""

[username]
format = "[$user]($style)"
style_root = 'fg:red_bright bg:snow_dark'
style_user = 'fg:snow_bright bg:snow_dark'

[hostname]
format = "@$hostname"

[fill]
symbol = "─"
style  = "fg:snow_dark"

[character]
success_symbol = "[](fg:snow_bright)"
error_symbol   = "[](fg:red_bright)"

[sudo]
disabled = false

format = "[$symbol]($style)"
symbol = " "
style  = "fg:orange_bright"

[directory]
format = "[[$read_only]($read_only_style)  $path]($style)"
style  = "fg:yellow_bright bg:snow_dark"

read_only       = "󰉐 "
read_only_style = "fg:red_bright bg:snow_dark"

[time]
disabled    = false
format      = "[$time]($style)"
style       = "fg:orange_bright bg:snow_dark"
time_format = "%a %d %b %R"

[battery]
format = "[](fg:snow_dark)[$symbol$percentage]($style)[─](fg:snow_dark)"

[[battery.display]]
threshold = 20
style     = "fg:orange_bright bg:snow_dark"

[shell]
disabled = false
format   = "[$indicator ]($style)"
style    = "fg:snow_bright bg:snow_dark"

[os]
disabled = false
format   = "[on $symbol$name $version]($style)"
style    = "fg:snow_bright bg:snow_dark"

[os.symbols]
AlmaLinux = " "
Android = " "
CachyOS = " "
Fedora = " "
NixOS = " "
RockyLinux = " "
Ubuntu = " "
Windows = " "

[env_var.FLAKE_CONFIG]
variable = "NIX_CURRENT_FLAKE_CONFIG"
symbol = " "
format = "Nix Flake: [$symbol$env_value]($style)"
style  = "fg:snow_bright"

# Dev tools
[python]
format = "Python: [$symbol$version]($style)"
symbol = " "
style  = "fg:green_bright"

python_binary = [['uv', 'run', '--no-python-downloads', '--no-project', 'python'], 'python3', 'python']

[nodejs]
format = "NodeJS: [$symbol$version]($style)([ Required: $engines_version](fg:orange_bright))"
style  = "fg:yellow_bright"
not_capable_style = "fg:red_bright"

[php]
format = "PHP: [$symbol$version]($style)"
symbol = " "

version_format = "${major}.${minor}"
style = "fg:blue_bright"

# Git configuration
[vcs]
order = ["git"]
git_modules = "$git_branch$git_status$git_state  $git_metrics$blank_fill"

[git_state]
format = ":[$state($progress_current/$progress_total)](fg:yellow_bright)"

[git_branch]
format = "Git branch: [$symbol$branch(:$remote_branch)]($style)"
style  = "fg:violet_bright"
symbol = ' '

[git_metrics]
disabled = false
format   = "Changes to commit: ([+$added ]($added_style))([-$deleted]($deleted_style))"

only_nonzero_diffs = false
added_style   = "fg:green_bright"
deleted_style = "fg:red_bright"

[git_status]
format = ":$all_status$ahead_behind"

conflicted = "[ ](fg:red_bright)"
ahead      = "[ ](fg:green_bright)"
behind     = "[ ](fg:blue_bright)"
diverged   = "[󰹹 ](fg:orange_bright)"
untracked  = "[󱀶 ](fg:pink_bright)"
stashed    = "[ ](fg:violet_bright)"
modified   = "[󰩌 ](fg:yellow_bright)"
staged     = "[ ](fg:green_bright)"
renamed    = "[󱪔 ](fg:blue_bright)"
deleted    = "[󱀷 ](fg:red_bright)"